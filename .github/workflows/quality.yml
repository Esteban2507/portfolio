name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes htmlhint "*.html"

      - name: Check local links and assets
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT = Path('.').resolve()
          HTML_FILES = sorted(ROOT.glob('*.html'))
          ERRORS = []

          class LinkParser(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for attr in ('href', 'src'):
                      value = attrs.get(attr)
                      if not value:
                          continue
                      parsed = urlparse(value)
                      if parsed.scheme or value.startswith(('#', 'mailto:', 'tel:')):
                          continue
                      clean = value.split('#', 1)[0].split('?', 1)[0]
                      if not clean:
                          continue
                      target = (self.source.parent / clean).resolve()
                      if ROOT not in target.parents and target != ROOT:
                          ERRORS.append(f'{self.source}: {attr} apunta fuera del repo: {value}')
                      elif not target.exists():
                          ERRORS.append(f'{self.source}: no existe {value}')

          for html_file in HTML_FILES:
              parser = LinkParser(html_file)
              parser.feed(html_file.read_text(encoding='utf-8'))

          if ERRORS:
              print('\n'.join(ERRORS))
              raise SystemExit(1)

          print(f'OK: {len(HTML_FILES)} archivos HTML validados.')

      - name: Guard against placeholders
        run: |
          ! grep -R "tuusuario\|estebangabriel\|actionable" --include="*.html" --include="*.md" .
