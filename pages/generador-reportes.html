<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Reportes Ejecutivos con IA — Esteban Gabrielloni</title>
  <meta name="description" content="Transformá datos crudos en reportes ejecutivos profesionales usando Inteligencia Artificial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0e0e10;color:#e8e8ec;-webkit-font-smoothing:antialiased;min-height:100vh}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:3px}
    textarea,input,select,button{font-family:inherit}
    textarea:focus,input:focus{outline:none}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .3s ease forwards}
    .report-grid{display:grid;grid-template-columns:1fr 1.6fr}
    .report-grid-2{display:grid;grid-template-columns:1fr 1fr}
    @media(max-width:640px){.report-grid,.report-grid-2{grid-template-columns:1fr}}
    @media(max-width:640px){.config-cols{flex-direction:column!important}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const P = {
      bg:'#0e0e10',surface:'#17171b',card:'#1c1c22',
      border:'#2a2a30',accent:'#F2C811',text:'#e8e8ec',
      muted:'#6b6b7a',success:'#4ade80',error:'#f87171',
    };

    const REPORT_TYPES = [
      { id:'ventas',      label:'📈 Ventas',             desc:'Resultados y tendencias' },
      { id:'financiero',  label:'💰 Financiero',          desc:'P&L, flujo de caja' },
      { id:'operaciones', label:'⚙️ Operaciones',         desc:'Eficiencia y KPIs' },
      { id:'proyecto',    label:'🎯 Estado de Proyecto',  desc:'Avance y riesgos' },
      { id:'rrhh',        label:'👥 RRHH',                desc:'Dotación y clima' },
      { id:'general',     label:'📋 General',             desc:'Sin estructura fija' },
    ];
    const TONES = [
      { id:'ejecutivo', label:'Ejecutivo', desc:'Directo, sin rodeos' },
      { id:'formal',    label:'Formal',    desc:'Profesional y estructurado' },
      { id:'narrativo', label:'Narrativo', desc:'Con contexto y explicaciones' },
    ];
    const AUDIENCES = [
      { id:'ceo',      label:'CEO / Directorio' },
      { id:'gerencia', label:'Gerencia media' },
      { id:'equipo',   label:'Equipo operativo' },
      { id:'cliente',  label:'Cliente externo' },
    ];

    async function generateReport(apiKey, { rawData, reportType, tone, audience, period, extraCtx }) {
      const tLabel = REPORT_TYPES.find(t => t.id === reportType)?.label ?? reportType;
      const aLabel = AUDIENCES.find(a => a.id === audience)?.label ?? audience;
      const tDesc  = TONES.find(t => t.id === tone)?.desc ?? '';

      const prompt = `Sos un analista de negocios experto en comunicación ejecutiva. Generá un reporte profesional en español.

CONFIGURACIÓN:
- Tipo: ${tLabel}
- Tono: ${tone} (${tDesc})
- Audiencia: ${aLabel}
- Período: ${period || 'no especificado'}
${extraCtx ? `- Contexto adicional: ${extraCtx}` : ''}

DATOS / INFORMACIÓN:
${rawData}

Generá el reporte usando EXACTAMENTE estos marcadores (sin texto entre secciones):

##TITULO##
[Título conciso del reporte]

##RESUMEN##
[2-3 oraciones con el mensaje más importante]

##HALLAZGOS##
[3-5 hallazgos, cada uno en una línea empezando con →]

##METRICAS##
[Números clave. Formato exacto: NOMBRE MÉTRICA|VALOR|↑ o ↓ o →]

##ANALISIS##
[Interpretación en 2-3 párrafos. Qué significan los datos y por qué importan]

##RIESGOS##
[2-3 riesgos u oportunidades, cada uno empezando con ⚠ o ✦]

##RECOMENDACIONES##
[3-4 acciones concretas numeradas]

##CONCLUSION##
[1-2 oraciones de cierre]

Adaptá el nivel de detalle a la audiencia: para CEO más conciso y estratégico, para equipo más táctico.`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-calls': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Error de API');
      return data.content?.[0]?.text ?? '';
    }

    function parseReport(raw) {
      const get = tag => {
        const m = raw.match(new RegExp(`##${tag}##\\n([\\s\\S]*?)(?=##|$)`));
        return m ? m[1].trim() : '';
      };
      return {
        titulo:          get('TITULO'),
        resumen:         get('RESUMEN'),
        hallazgos:       get('HALLAZGOS').split('\n').filter(Boolean),
        metricas:        get('METRICAS').split('\n').filter(l => l.includes('|')).map(l => {
                           const [nombre, valor, tend] = l.split('|');
                           return { nombre: nombre?.trim(), valor: valor?.trim(), tend: tend?.trim() };
                         }),
        analisis:        get('ANALISIS'),
        riesgos:         get('RIESGOS').split('\n').filter(Boolean),
        recomendaciones: get('RECOMENDACIONES').split('\n').filter(Boolean),
        conclusion:      get('CONCLUSION'),
      };
    }

    function MetricCard({ nombre, valor, tend }) {
      const color = tend === '↑' ? P.success : tend === '↓' ? P.error : P.muted;
      return (
        <div style={{ background: P.bg, border: `1px solid ${P.border}`, borderRadius: 10, padding: '14px 16px', minWidth: 110 }}>
          <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: .8, marginBottom: 6 }}>{nombre}</p>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <p style={{ fontSize: 20, fontWeight: 700, color: P.text, lineHeight: 1 }}>{valor}</p>
            {tend && <span style={{ fontSize: 18, color }}>{tend}</span>}
          </div>
        </div>
      );
    }

    function ReportView({ report, meta, onReset }) {
      const [copied, setCopied] = useState(false);

      function toText() {
        return [
          report.titulo,
          '═'.repeat(Math.min(report.titulo.length, 50)),
          '', 'RESUMEN', report.resumen,
          '', 'HALLAZGOS CLAVE', ...report.hallazgos,
          '', 'MÉTRICAS', ...report.metricas.map(m => `${m.nombre}: ${m.valor} ${m.tend}`),
          '', 'ANÁLISIS', report.analisis,
          '', 'RIESGOS Y OPORTUNIDADES', ...report.riesgos,
          '', 'RECOMENDACIONES', ...report.recomendaciones,
          '', 'CONCLUSIÓN', report.conclusion,
          '', '---', `Generado con IA · ${meta.period || new Date().toLocaleDateString('es-AR')}`,
        ].join('\n');
      }

      function copy() {
        navigator.clipboard.writeText(toText());
        setCopied(true);
        setTimeout(() => setCopied(false), 2200);
      }

      const typeLabel = REPORT_TYPES.find(t => t.id === meta.reportType)?.label ?? '';
      const audLabel  = AUDIENCES.find(a => a.id === meta.audience)?.label ?? '';

      return (
        <div className="fade-in">
          {/* Encabezado */}
          <div style={{ background: 'linear-gradient(135deg,#1a1a00,#0e0e10)', border: `1px solid ${P.accent}33`, borderBottom: `2px solid ${P.accent}`, borderRadius: '12px 12px 0 0', padding: '22px 26px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 12 }}>
              <div>
                <p style={{ fontSize: 11, color: P.accent, textTransform: 'uppercase', letterSpacing: 1.5, marginBottom: 8 }}>Reporte Ejecutivo · {typeLabel}</p>
                <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, fontWeight: 700, lineHeight: 1.3 }}>{report.titulo}</h2>
                <p style={{ fontSize: 12, color: P.muted, marginTop: 6 }}>
                  {meta.period && `Período: ${meta.period} · `}Audiencia: {audLabel}
                </p>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={copy}
                  style={{ background: copied ? P.success : 'transparent', border: `1px solid ${copied ? P.success : P.border}`, borderRadius: 8, padding: '8px 14px', color: copied ? '#000' : P.text, fontSize: 12, cursor: 'pointer', fontWeight: 600, transition: 'all .2s' }}>
                  {copied ? '✓ Copiado' : 'Copiar texto'}
                </button>
                <button onClick={onReset}
                  style={{ background: 'transparent', border: `1px solid ${P.border}`, borderRadius: 8, padding: '8px 14px', color: P.muted, fontSize: 12, cursor: 'pointer' }}>
                  Nuevo reporte
                </button>
              </div>
            </div>
          </div>

          {/* Resumen */}
          <div style={{ background: `${P.accent}10`, border: `1px solid ${P.accent}22`, borderLeft: `3px solid ${P.accent}`, borderTop: 'none', padding: '16px 22px' }}>
            <p style={{ fontSize: 11, color: P.accent, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 }}>Resumen ejecutivo</p>
            <p style={{ fontSize: 14, lineHeight: 1.65 }}>{report.resumen}</p>
          </div>

          {/* Métricas */}
          {report.metricas.length > 0 && (
            <div style={{ background: P.surface, border: `1px solid ${P.border}`, borderTop: 'none', padding: '18px 22px' }}>
              <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 14 }}>Métricas principales</p>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                {report.metricas.map((m, i) => <MetricCard key={i} {...m} />)}
              </div>
            </div>
          )}

          {/* Hallazgos + Análisis */}
          <div className="report-grid" style={{ border: `1px solid ${P.border}`, borderTop: 'none', background: P.card }}>
            <div style={{ padding: '18px 22px', borderRight: `1px solid ${P.border}` }}>
              <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 14 }}>Hallazgos clave</p>
              <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 10 }}>
                {report.hallazgos.map((h, i) => (
                  <li key={i} style={{ fontSize: 13, lineHeight: 1.55, display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                    <span style={{ color: P.accent, flexShrink: 0, marginTop: 1 }}>→</span>
                    <span>{h.replace(/^→\s*/,'')}</span>
                  </li>
                ))}
              </ul>
            </div>
            <div style={{ padding: '18px 22px' }}>
              <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 14 }}>Análisis</p>
              <p style={{ fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{report.analisis}</p>
            </div>
          </div>

          {/* Riesgos + Recomendaciones */}
          <div className="report-grid-2" style={{ background: P.surface, border: `1px solid ${P.border}`, borderTop: 'none' }}>
            <div style={{ padding: '18px 22px', borderRight: `1px solid ${P.border}` }}>
              <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 14 }}>Riesgos y oportunidades</p>
              <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 10 }}>
                {report.riesgos.map((r, i) => <li key={i} style={{ fontSize: 13, lineHeight: 1.55 }}>{r}</li>)}
              </ul>
            </div>
            <div style={{ padding: '18px 22px' }}>
              <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 14 }}>Recomendaciones</p>
              <ol style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 10 }}>
                {report.recomendaciones.map((r, i) => (
                  <li key={i} style={{ fontSize: 13, lineHeight: 1.55, display: 'flex', gap: 10 }}>
                    <span style={{ background: P.accent, color: '#000', borderRadius: '50%', width: 20, height: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, flexShrink: 0, marginTop: 1 }}>{i+1}</span>
                    <span>{r.replace(/^\d+\.\s*/,'')}</span>
                  </li>
                ))}
              </ol>
            </div>
          </div>

          {/* Conclusión */}
          <div style={{ background: P.bg, border: `1px solid ${P.border}`, borderTop: 'none', borderRadius: '0 0 12px 12px', padding: '16px 22px', display: 'flex', gap: 14 }}>
            <div style={{ width: 3, background: P.accent, borderRadius: 2, flexShrink: 0 }} />
            <div>
              <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>Conclusión</p>
              <p style={{ fontSize: 13, lineHeight: 1.65 }}>{report.conclusion}</p>
            </div>
          </div>
        </div>
      );
    }

    function KeySetup({ onConfirm }) {
      const [key, setKey] = useState('');
      const [err, setErr] = useState('');
      const [testing, setTesting] = useState(false);

      async function confirm() {
        if (!key.trim().startsWith('sk-')) { setErr('La clave debe comenzar con "sk-".'); return; }
        setTesting(true); setErr('');
        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': key.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-calls': 'true' },
            body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 10, messages: [{ role: 'user', content: 'test' }] }),
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          onConfirm(key.trim());
        } catch (e) {
          setErr('No se pudo validar la clave. Verificá que sea correcta y con saldo disponible.');
          setTesting(false);
        }
      }

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ maxWidth: 440, width: '100%' }}>
            <a href="index.html" style={{ color: P.muted, fontSize: 13, textDecoration: 'none', display: 'block', marginBottom: 40 }}>← Volver al portfolio</a>
            <div style={{ width: 48, height: 48, borderRadius: 12, background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, marginBottom: 20, color: '#000', fontWeight: 700 }}>✎</div>
            <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, marginBottom: 8 }}>Generador de Reportes</h1>
            <p style={{ color: P.muted, fontSize: 14, lineHeight: 1.65, marginBottom: 32 }}>Pegá tus datos crudos —métricas, bullets, texto de un mail— y la IA genera un reporte ejecutivo profesional listo para presentar. Ingresá tu clave de API de Anthropic para comenzar.</p>
            <div style={{ background: P.surface, border: `1px solid ${P.border}`, borderRadius: 12, padding: 20, marginBottom: 14 }}>
              <label style={{ fontSize: 12, color: P.muted, display: 'block', marginBottom: 8, fontWeight: 600, textTransform: 'uppercase', letterSpacing: .8 }}>Clave de API de Anthropic</label>
              <input type="password" value={key} onChange={e => setKey(e.target.value)} onKeyDown={e => e.key === 'Enter' && confirm()} placeholder="sk-ant-..."
                style={{ width: '100%', background: P.bg, border: `1px solid ${P.border}`, borderRadius: 8, padding: '10px 12px', color: P.text, fontSize: 14, marginBottom: 12 }} />
              {err && <p style={{ color: P.error, fontSize: 12, marginBottom: 12 }}>{err}</p>}
              <button onClick={confirm} disabled={!key.trim() || testing}
                style={{ width: '100%', background: P.accent, border: 'none', borderRadius: 8, padding: 11, color: '#000', fontSize: 14, fontWeight: 700, cursor: 'pointer', opacity: (!key.trim() || testing) ? .6 : 1 }}>
                {testing ? 'Verificando…' : 'Empezar →'}
              </button>
            </div>
            <p style={{ fontSize: 12, color: P.muted, lineHeight: 1.6 }}>La clave se usa solo en esta sesión y nunca se almacena. Obtené la tuya en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer" style={{ color: P.accent }}>console.anthropic.com</a>.</p>
          </div>
        </div>
      );
    }

    function App() {
      const [apiKey, setApiKey]     = useState('');
      const [step, setStep]         = useState('config');
      const [rawData, setRawData]   = useState('');
      const [reportType, setType]   = useState('ventas');
      const [tone, setTone]         = useState('ejecutivo');
      const [audience, setAud]      = useState('gerencia');
      const [period, setPeriod]     = useState('');
      const [extraCtx, setExtra]    = useState('');
      const [report, setReport]     = useState(null);
      const [err, setErr]           = useState('');

      async function generate() {
        if (!rawData.trim()) { setErr('Pegá los datos antes de generar el reporte.'); return; }
        setErr(''); setStep('generating');
        try {
          const raw = await generateReport(apiKey, { rawData, reportType, tone, audience, period, extraCtx });
          setReport(parseReport(raw));
          setStep('result');
        } catch (e) {
          setErr(e.message || 'Error al generar el reporte.');
          setStep('config');
        }
      }

      function reset() { setStep('config'); setReport(null); setRawData(''); setErr(''); }

      if (!apiKey) return <KeySetup onConfirm={setApiKey} />;

      return (
        <div style={{ minHeight: '100vh' }}>
          <header style={{ borderBottom: `1px solid ${P.border}`, padding: '12px 26px', display: 'flex', alignItems: 'center', gap: 12, background: P.surface, position: 'sticky', top: 0, zIndex: 10 }}>
            <a href="index.html" style={{ color: P.muted, fontSize: 12, textDecoration: 'none', marginRight: 4 }}>←</a>
            <div style={{ width: 30, height: 30, borderRadius: 8, background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, color: '#000' }}>✎</div>
            <div>
              <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>Generador de Reportes Ejecutivos</h1>
              <p style={{ fontSize: 11, color: P.muted, marginTop: 2 }}>Datos crudos → reporte profesional con IA</p>
            </div>
            {step === 'result' && (
              <button onClick={reset} style={{ marginLeft: 'auto', background: 'transparent', border: `1px solid ${P.border}`, borderRadius: 8, padding: '7px 14px', color: P.muted, fontSize: 12, cursor: 'pointer' }}>
                + Nuevo reporte
              </button>
            )}
          </header>

          <div style={{ maxWidth: 880, margin: '0 auto', padding: '28px 22px' }}>

            {/* Config */}
            {step === 'config' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 26 }}>
                {/* Tipo */}
                <div>
                  <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 12 }}>Tipo de reporte</label>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 10 }}>
                    {REPORT_TYPES.map(t => (
                      <button key={t.id} onClick={() => setType(t.id)}
                        style={{ background: reportType === t.id ? `${P.accent}15` : P.surface, border: `1px solid ${reportType === t.id ? P.accent : P.border}`, borderRadius: 10, padding: '11px 14px', cursor: 'pointer', textAlign: 'left', transition: 'all .15s' }}>
                        <p style={{ fontSize: 13, color: reportType === t.id ? P.accent : P.text, fontWeight: 600 }}>{t.label}</p>
                        <p style={{ fontSize: 11, color: P.muted, marginTop: 3 }}>{t.desc}</p>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Tono + Audiencia */}
                <div className="config-cols" style={{ display: 'flex', gap: 20 }}>
                  <div style={{ flex: 1 }}>
                    <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 10 }}>Tono</label>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {TONES.map(t => (
                        <button key={t.id} onClick={() => setTone(t.id)}
                          style={{ background: tone === t.id ? `${P.accent}15` : P.surface, border: `1px solid ${tone === t.id ? P.accent : P.border}`, borderRadius: 8, padding: '10px 14px', cursor: 'pointer', textAlign: 'left', display: 'flex', gap: 10, alignItems: 'center' }}>
                          <div style={{ width: 8, height: 8, borderRadius: '50%', background: tone === t.id ? P.accent : P.border, flexShrink: 0 }} />
                          <div>
                            <p style={{ fontSize: 13, color: tone === t.id ? P.accent : P.text, fontWeight: 600 }}>{t.label}</p>
                            <p style={{ fontSize: 11, color: P.muted }}>{t.desc}</p>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 10 }}>Audiencia</label>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {AUDIENCES.map(a => (
                        <button key={a.id} onClick={() => setAud(a.id)}
                          style={{ background: audience === a.id ? `${P.accent}15` : P.surface, border: `1px solid ${audience === a.id ? P.accent : P.border}`, borderRadius: 8, padding: '10px 14px', cursor: 'pointer', textAlign: 'left', display: 'flex', gap: 10, alignItems: 'center' }}>
                          <div style={{ width: 8, height: 8, borderRadius: '50%', background: audience === a.id ? P.accent : P.border, flexShrink: 0 }} />
                          <p style={{ fontSize: 13, color: audience === a.id ? P.accent : P.text, fontWeight: 600 }}>{a.label}</p>
                        </button>
                      ))}
                    </div>
                    <div style={{ marginTop: 12 }}>
                      <label style={{ fontSize: 11, color: P.muted, display: 'block', marginBottom: 6 }}>Período (opcional)</label>
                      <input value={period} onChange={e => setPeriod(e.target.value)} placeholder="Ej: Q2 2025, Junio 2025"
                        style={{ width: '100%', background: P.surface, border: `1px solid ${P.border}`, borderRadius: 8, padding: '9px 12px', color: P.text, fontSize: 13 }} />
                    </div>
                  </div>
                </div>

                {/* Datos */}
                <div>
                  <label style={{ fontSize: 13, fontWeight: 600, display: 'block', marginBottom: 4 }}>Datos / Información</label>
                  <p style={{ fontSize: 12, color: P.muted, marginBottom: 10 }}>Pegá métricas, bullets, texto de un mail o cualquier dato crudo. La IA lo transforma en un reporte estructurado.</p>
                  <textarea value={rawData} onChange={e => setRawData(e.target.value)} rows={10}
                    placeholder={`Ejemplo de lo que podés pegar:\n\n- Ventas Enero: $1.2M (+15% vs año anterior)\n- Ventas Febrero: $980K (-18%)\n- Top producto: Línea Premium con 42% del revenue\n- Devoluciones aumentaron 8%\n- 3 clientes nuevos en Q1\n- Objetivo Q2: $3.5M\n\nO copiá una tabla de Excel, un resumen de reunión, un mail con datos...`}
                    style={{ width: '100%', background: P.surface, border: `1px solid ${P.border}`, borderRadius: 10, padding: '13px 15px', color: P.text, fontSize: 13, lineHeight: 1.6, resize: 'vertical' }} />
                </div>

                {/* Contexto extra */}
                <div>
                  <label style={{ fontSize: 11, color: P.muted, display: 'block', marginBottom: 6 }}>Contexto adicional (opcional)</label>
                  <input value={extraCtx} onChange={e => setExtra(e.target.value)} placeholder="Ej: La empresa está en proceso de expansión regional, enfocarse en oportunidades de crecimiento"
                    style={{ width: '100%', background: P.surface, border: `1px solid ${P.border}`, borderRadius: 8, padding: '9px 12px', color: P.text, fontSize: 13 }} />
                </div>

                {err && <p style={{ color: P.error, fontSize: 13 }}>{err}</p>}

                <button onClick={generate}
                  style={{ background: P.accent, border: 'none', borderRadius: 10, padding: '13px 28px', color: '#000', fontSize: 14, fontWeight: 700, cursor: 'pointer', alignSelf: 'flex-start', transition: 'opacity .2s' }}
                  onMouseEnter={e => e.currentTarget.style.opacity = '.85'}
                  onMouseLeave={e => e.currentTarget.style.opacity = '1'}>
                  Generar reporte →
                </button>
              </div>
            )}

            {/* Generando */}
            {step === 'generating' && (
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: 380, gap: 20 }}>
                <div style={{ width: 54, height: 54, borderRadius: 14, background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26, color: '#000', fontWeight: 700, animation: 'spin 2s linear infinite' }}>✎</div>
                <div style={{ textAlign: 'center' }}>
                  <p style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 18, fontWeight: 700 }}>Generando reporte…</p>
                  <p style={{ color: P.muted, fontSize: 13, marginTop: 6 }}>La IA está analizando tus datos y estructurando el informe</p>
                </div>
              </div>
            )}

            {/* Resultado */}
            {step === 'result' && report && (
              <ReportView
                report={report}
                meta={{ reportType, tone, audience, period }}
                onReset={reset}
              />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
