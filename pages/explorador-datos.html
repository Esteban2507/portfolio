<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Datos con IA — Esteban Gabrielloni</title>
  <meta name="description" content="Hacé preguntas sobre tus datos en lenguaje natural usando Inteligencia Artificial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Inter',sans-serif;background:#0e0e10;color:#e8e8ec;-webkit-font-smoothing:antialiased}
    #root{height:100%;display:flex;flex-direction:column}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:3px}
    textarea,input,select,button{font-family:inherit}
    textarea:focus,input:focus{outline:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .fade-in{animation:fadeIn .25s ease forwards}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const P = {
      bg:'#0e0e10',surface:'#17171b',border:'#2a2a30',
      accent:'#F2C811',text:'#e8e8ec',muted:'#6b6b7a',
      success:'#4ade80',error:'#f87171',
    };
    const COLORS = ['#F2C811','#60a5fa','#f472b6','#34d399','#a78bfa','#fb923c'];
    const HINTS = [
      'Cuál es el total por categoría?',
      'Qué mes tuvo mayor valor?',
      'Cuál es el promedio general?',
      'Mostrame la distribución en un gráfico',
      'Qué tendencia se observa?',
    ];

    function parseChartBlock(raw) {
      const m = raw.match(/```chart\n([\s\S]*?)\n```/);
      const text = raw.replace(/```chart[\s\S]*?```/g,'').trim();
      let chart = null;
      if (m) { try { chart = JSON.parse(m[1]); } catch {} }
      return { text, chart };
    }

    async function askClaude(apiKey, rows, cols, question) {
      const preview = rows.slice(0, 60);
      const prompt = `Sos un analista de datos experto. Respondé en español de forma clara y directa.

DATASET:
- Columnas: ${cols.join(', ')}
- Total de filas: ${rows.length}
- Datos (primeras ${preview.length} filas): ${JSON.stringify(preview)}

PREGUNTA: "${question}"

Respondé con insight real. Sé específico con números.

Si tiene sentido mostrar un gráfico, incluí AL FINAL exactamente este bloque:
\`\`\`chart
{"type":"bar","title":"...","data":[{"label":"...","value":numero},...]}
\`\`\`
type puede ser: "bar", "line" o "pie". Máximo 8 puntos. Si no hace falta gráfico no lo incluyas.`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-calls': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Error de API');
      return data.content?.[0]?.text ?? '';
    }

    function ChartCanvas({ chart }) {
      const canvasRef = useRef(null);
      const instanceRef = useRef(null);
      useEffect(() => {
        if (!chart?.data?.length || !canvasRef.current) return;
        if (instanceRef.current) { instanceRef.current.destroy(); instanceRef.current = null; }
        const isPie = chart.type === 'pie';
        instanceRef.current = new Chart(canvasRef.current.getContext('2d'), {
          type: isPie ? 'doughnut' : chart.type,
          data: {
            labels: chart.data.map(d => d.label),
            datasets: [{
              data: chart.data.map(d => d.value),
              backgroundColor: isPie ? COLORS : COLORS[0] + 'bb',
              borderColor: isPie ? COLORS : COLORS[0],
              borderWidth: isPie ? 2 : 1,
              borderRadius: chart.type === 'bar' ? 4 : 0,
              tension: 0.35,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: isPie, labels: { color: P.text, padding: 14, font: { size: 11 } } },
              tooltip: {
                backgroundColor: P.surface, borderColor: P.border, borderWidth: 1,
                titleColor: P.muted, bodyColor: P.text,
                callbacks: { label: ctx => (ctx.parsed.y ?? ctx.parsed).toLocaleString('es-AR') },
              },
            },
            scales: isPie ? {} : {
              x: { ticks: { color: P.muted, font: { size: 11 }, maxRotation: 35 }, grid: { color: P.border } },
              y: { ticks: { color: P.muted, font: { size: 11 } }, grid: { color: P.border } },
            },
          },
        });
        return () => { if (instanceRef.current) { instanceRef.current.destroy(); instanceRef.current = null; } };
      }, [chart]);
      return (
        <div style={{ background: P.bg, border: `1px solid ${P.border}`, borderRadius: 10, padding: 14, marginTop: 12, height: 220 }}>
          {chart.title && <p style={{ fontSize: 11, color: P.muted, textAlign: 'center', marginBottom: 6, textTransform: 'uppercase', letterSpacing: 1 }}>{chart.title}</p>}
          <canvas ref={canvasRef} />
        </div>
      );
    }

    function DataPreview({ rows, cols }) {
      const vis = cols.slice(0, 6);
      const hidden = cols.length - vis.length;
      return (
        <div style={{ overflowX: 'auto', border: `1px solid ${P.border}`, borderRadius: 8, fontSize: 12 }}>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ background: P.bg }}>
                {vis.map(c => <th key={c} style={{ padding: '7px 10px', color: P.accent, fontWeight: 600, textAlign: 'left', borderBottom: `1px solid ${P.border}`, whiteSpace: 'nowrap' }}>{c}</th>)}
                {hidden > 0 && <th style={{ padding: '7px 10px', color: P.muted, borderBottom: `1px solid ${P.border}` }}>+{hidden}</th>}
              </tr>
            </thead>
            <tbody>
              {rows.slice(0, 4).map((row, i) => (
                <tr key={i} style={{ background: i % 2 === 0 ? P.surface : 'transparent' }}>
                  {vis.map(c => <td key={c} style={{ padding: '6px 10px', color: P.text, borderBottom: `1px solid ${P.border}`, whiteSpace: 'nowrap', maxWidth: 120, overflow: 'hidden', textOverflow: 'ellipsis' }}>{String(row[c] ?? '')}</td>)}
                  {hidden > 0 && <td style={{ borderBottom: `1px solid ${P.border}` }} />}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Bubble({ msg }) {
      const isUser = msg.role === 'user';
      return (
        <div className="fade-in" style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start', marginBottom: 14 }}>
          {!isUser && <div style={{ width: 28, height: 28, borderRadius: '50%', background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, flexShrink: 0, marginRight: 8, marginTop: 2, color: '#000', fontWeight: 700 }}>✦</div>}
          <div style={{ maxWidth: '76%', background: isUser ? P.accent : P.surface, color: isUser ? '#000' : P.text, borderRadius: isUser ? '14px 14px 4px 14px' : '14px 14px 14px 4px', padding: '10px 14px', fontSize: 14, lineHeight: 1.65, border: isUser ? 'none' : `1px solid ${P.border}` }}>
            <p style={{ margin: 0, whiteSpace: 'pre-wrap' }}>{msg.text}</p>
            {msg.chart && <ChartCanvas chart={msg.chart} />}
          </div>
        </div>
      );
    }

    function KeySetup({ onConfirm }) {
      const [key, setKey] = useState('');
      const [err, setErr] = useState('');
      const [testing, setTesting] = useState(false);

      async function confirm() {
        if (!key.trim().startsWith('sk-')) { setErr('La clave debe comenzar con "sk-".'); return; }
        setTesting(true); setErr('');
        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': key.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-calls': 'true' },
            body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 10, messages: [{ role: 'user', content: 'test' }] }),
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          onConfirm(key.trim());
        } catch (e) {
          setErr('No se pudo validar la clave. Verificá que sea correcta y con saldo.');
          setTesting(false);
        }
      }

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ maxWidth: 440, width: '100%' }}>
            <a href="index.html" style={{ color: P.muted, fontSize: 13, textDecoration: 'none', display: 'block', marginBottom: 40 }}>← Volver al portfolio</a>
            <div style={{ width: 48, height: 48, borderRadius: 12, background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, marginBottom: 20, color: '#000', fontWeight: 700 }}>✦</div>
            <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, marginBottom: 8 }}>Explorador de Datos</h1>
            <p style={{ color: P.muted, fontSize: 14, lineHeight: 1.65, marginBottom: 32 }}>Hacé preguntas en español sobre tus datos y la IA responde con análisis y gráficos automáticos. Ingresá tu clave de API de Anthropic para empezar.</p>
            <div style={{ background: P.surface, border: `1px solid ${P.border}`, borderRadius: 12, padding: 20, marginBottom: 14 }}>
              <label style={{ fontSize: 12, color: P.muted, display: 'block', marginBottom: 8, fontWeight: 600, textTransform: 'uppercase', letterSpacing: .8 }}>Clave de API de Anthropic</label>
              <input type="password" value={key} onChange={e => setKey(e.target.value)} onKeyDown={e => e.key === 'Enter' && confirm()} placeholder="sk-ant-..."
                style={{ width: '100%', background: P.bg, border: `1px solid ${P.border}`, borderRadius: 8, padding: '10px 12px', color: P.text, fontSize: 14, marginBottom: 12 }} />
              {err && <p style={{ color: P.error, fontSize: 12, marginBottom: 12 }}>{err}</p>}
              <button onClick={confirm} disabled={!key.trim() || testing}
                style={{ width: '100%', background: P.accent, border: 'none', borderRadius: 8, padding: 11, color: '#000', fontSize: 14, fontWeight: 700, cursor: 'pointer', opacity: (!key.trim() || testing) ? .6 : 1 }}>
                {testing ? 'Verificando…' : 'Empezar →'}
              </button>
            </div>
            <p style={{ fontSize: 12, color: P.muted, lineHeight: 1.6 }}>La clave se usa solo en esta sesión y nunca se almacena. Obtené la tuya en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer" style={{ color: P.accent }}>console.anthropic.com</a>.</p>
          </div>
        </div>
      );
    }

    function App() {
      const [apiKey, setApiKey] = useState('');
      const [rows, setRows]   = useState([]);
      const [cols, setCols]   = useState([]);
      const [fileName, setFN] = useState('');
      const [messages, setMsgs] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [dragOver, setDrag] = useState(false);
      const [err, setErr]     = useState('');
      const bottomRef = useRef(null);
      const fileRef   = useRef(null);
      const hasData = rows.length > 0;

      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      function loadFile(file) {
        if (!file) return;
        setFN(file.name); setMsgs([]); setErr('');
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'csv') {
          Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: ({ data }) => init(data),
            error: () => setErr('No se pudo leer el CSV.'),
          });
        } else if (['xlsx','xls'].includes(ext)) {
          const r = new FileReader();
          r.onload = e => {
            try {
              const wb = XLSX.read(e.target.result, { type: 'binary' });
              init(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }));
            } catch { setErr('No se pudo leer el Excel.'); }
          };
          r.readAsBinaryString(file);
        } else { setErr('Usá .csv, .xlsx o .xls'); }
      }

      function init(data) {
        if (!data.length) { setErr('El archivo está vacío.'); return; }
        const columns = Object.keys(data[0]);
        setRows(data); setCols(columns);
        setMsgs([{ role: 'assistant', text: `Dataset cargado correctamente ✓\n\n📊 ${data.length.toLocaleString('es-AR')} filas · ${columns.length} columnas\nColumnas: ${columns.join(', ')}\n\n¿Qué querés analizar?`, chart: null }]);
      }

      async function send(question) {
        const q = (question || input).trim();
        if (!q || !rows.length || loading) return;
        setInput(''); setErr('');
        setMsgs(prev => [...prev, { role: 'user', text: q }]);
        setLoading(true);
        try {
          const raw = await askClaude(apiKey, rows, cols, q);
          const { text, chart } = parseChartBlock(raw);
          setMsgs(prev => [...prev, { role: 'assistant', text, chart }]);
        } catch (e) { setErr(e.message || 'Error al conectar con la IA.'); }
        setLoading(false);
      }

      if (!apiKey) return <KeySetup onConfirm={setApiKey} />;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
          <header style={{ borderBottom: `1px solid ${P.border}`, padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 12, background: P.surface, flexShrink: 0 }}>
            <a href="index.html" style={{ color: P.muted, fontSize: 12, textDecoration: 'none', marginRight: 4 }}>←</a>
            <div style={{ width: 30, height: 30, borderRadius: 8, background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, color: '#000', flexShrink: 0 }}>✦</div>
            <div>
              <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>Explorador de Datos con IA</h1>
              <p style={{ fontSize: 11, color: P.muted, marginTop: 2 }}>Preguntá en español — la IA analiza y grafica</p>
            </div>
            {hasData && (
              <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, background: P.bg, border: `1px solid ${P.border}`, borderRadius: 8, padding: '5px 10px' }}>
                <span style={{ fontSize: 11, color: P.success }}>●</span>
                <span style={{ fontSize: 11, color: P.muted }}>{fileName} · {rows.length.toLocaleString('es-AR')} filas</span>
              </div>
            )}
          </header>

          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            <aside style={{ width: hasData ? 270 : '100%', borderRight: hasData ? `1px solid ${P.border}` : 'none', padding: 18, overflowY: 'auto', background: hasData ? P.surface : P.bg, display: 'flex', flexDirection: 'column', gap: 16, flexShrink: 0 }}>
              {!hasData && (
                <div style={{ maxWidth: 460, margin: '48px auto', width: '100%' }}>
                  <p style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, marginBottom: 8 }}>Hablale a tus datos.</p>
                  <p style={{ color: P.muted, fontSize: 14, lineHeight: 1.65, marginBottom: 32 }}>Subí un archivo y hacé preguntas en español. La IA analiza y genera gráficos automáticamente.</p>
                </div>
              )}
              <div
                onDragOver={e => { e.preventDefault(); setDrag(true); }}
                onDragLeave={() => setDrag(false)}
                onDrop={e => { e.preventDefault(); setDrag(false); loadFile(e.dataTransfer.files[0]); }}
                onClick={() => fileRef.current?.click()}
                style={{ border: `2px dashed ${dragOver ? P.accent : P.border}`, borderRadius: 10, padding: hasData ? 14 : 36, textAlign: 'center', cursor: 'pointer', background: dragOver ? '#F2C81108' : 'transparent', transition: 'all .2s', maxWidth: hasData ? '100%' : 460, margin: hasData ? 0 : '0 auto', width: '100%' }}>
                <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" style={{ display: 'none' }} onChange={e => loadFile(e.target.files[0])} />
                <div style={{ fontSize: hasData ? 20 : 30, marginBottom: 6 }}>📂</div>
                <p style={{ color: hasData ? P.muted : P.text, fontSize: hasData ? 12 : 13, fontWeight: 500 }}>{hasData ? 'Cambiar archivo' : 'Soltá tu archivo o hacé click'}</p>
                {!hasData && <p style={{ color: P.muted, fontSize: 12, marginTop: 4 }}>CSV · XLSX · XLS</p>}
              </div>
              {err && <p style={{ color: P.error, fontSize: 12, background: '#f8717115', border: `1px solid ${P.error}33`, borderRadius: 8, padding: '8px 12px' }}>{err}</p>}
              {hasData && (
                <>
                  <div>
                    <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: .9, marginBottom: 8 }}>Vista previa</p>
                    <DataPreview rows={rows} cols={cols} />
                    <p style={{ fontSize: 11, color: P.muted, marginTop: 5 }}>4 de {rows.length.toLocaleString('es-AR')} filas · {cols.length} columnas</p>
                  </div>
                  <div>
                    <p style={{ fontSize: 11, color: P.muted, textTransform: 'uppercase', letterSpacing: .9, marginBottom: 8 }}>Sugerencias</p>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {HINTS.map(h => (
                        <button key={h} onClick={() => send(h)}
                          style={{ textAlign: 'left', background: 'transparent', border: `1px solid ${P.border}`, borderRadius: 8, padding: '8px 11px', color: P.text, fontSize: 12, cursor: 'pointer', transition: 'border-color .15s,color .15s' }}
                          onMouseEnter={e => { e.currentTarget.style.borderColor = P.accent; e.currentTarget.style.color = P.accent; }}
                          onMouseLeave={e => { e.currentTarget.style.borderColor = P.border; e.currentTarget.style.color = P.text; }}>
                          {h}
                        </button>
                      ))}
                    </div>
                  </div>
                </>
              )}
            </aside>

            {hasData && (
              <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
                <div style={{ flex: 1, overflowY: 'auto', padding: '18px 22px' }}>
                  {messages.map((m, i) => <Bubble key={i} msg={m} />)}
                  {loading && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, color: P.muted, fontSize: 13 }}>
                      <div style={{ width: 28, height: 28, borderRadius: '50%', background: P.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, color: '#000', fontWeight: 700 }}>✦</div>
                      <span style={{ animation: 'pulse 1.2s infinite' }}>Analizando…</span>
                    </div>
                  )}
                  <div ref={bottomRef} />
                </div>
                <div style={{ borderTop: `1px solid ${P.border}`, padding: '14px 22px', background: P.surface, flexShrink: 0 }}>
                  <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end' }}>
                    <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                      placeholder="Ej: Cuál fue el mejor mes? (Enter para enviar)"
                      rows={2}
                      style={{ flex: 1, background: P.bg, border: `1px solid ${P.border}`, borderRadius: 10, padding: '9px 13px', color: P.text, fontSize: 14, resize: 'none', lineHeight: 1.5 }} />
                    <button onClick={() => send()} disabled={loading || !input.trim()}
                      style={{ background: loading || !input.trim() ? P.border : P.accent, color: loading || !input.trim() ? P.muted : '#000', border: 'none', borderRadius: 10, width: 44, height: 52, cursor: loading || !input.trim() ? 'not-allowed' : 'pointer', fontWeight: 700, fontSize: 18, flexShrink: 0, transition: 'background .2s' }}>↑</button>
                  </div>
                </div>
              </main>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
